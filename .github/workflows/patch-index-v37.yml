name: Safely connect push client v3.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-index-v37.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html safely
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Version bump for this app update.
          s = s.replace('v3.7', 'v3.8')
          s = s.replace('v3.6', 'v3.8')

          # Load push-client.js from inside the existing app JavaScript.
          # Dynamic import is non-blocking and a failure cannot stop the main UI.
          marker = "  checkForgottenShiftNotification();\n"
          loader = "  import('./push-client.js').catch(err => console.warn('Push client load failed:', err));\n"

          if s.count(marker) != 1:
              raise SystemExit(f'Expected exactly one boot marker, found {s.count(marker)}')

          if loader not in s:
              s = s.replace(marker, marker + loader, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          loader = "import('./push-client.js').catch(err => console.warn('Push client load failed:', err));"
          assert s.count(loader) == 1, 'push client loader must exist exactly once'
          assert 'v3.8' in s, 'version was not bumped to v3.8'
          assert "checkForgottenShiftNotification();\n  import('./push-client.js')" in s, 'loader is not in the app boot section'
          PY

      - name: Commit index update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Safely connect push client and bump app to v3.8'
            git push
          fi
