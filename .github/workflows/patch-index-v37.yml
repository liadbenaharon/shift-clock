name: Patch index for push client v3.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-index-v37.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('v3.6', 'v3.7')

          tag = '<script type="module" src="./push-client.js"></script>'
          # The same tag may appear inside the generated payslip HTML string.
          # What matters is that the real app page loads it immediately before
          # the final </body> tag.
          closing = '</body>\n</html>'
          expected = f'{tag}\n{closing}'
          if expected not in s:
              pos = s.rfind(closing)
              if pos == -1:
                  raise SystemExit('Could not find final </body></html> in index.html')
              s = s[:pos] + tag + '\n' + s[pos:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          tag = '<script type="module" src="./push-client.js"></script>'
          assert f'{tag}\n</body>\n</html>' in s, 'push-client.js is not loaded by the real app page'
          assert 'v3.7' in s
          PY

      - name: Commit index update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Connect push client to main app page'
            git push
          fi
