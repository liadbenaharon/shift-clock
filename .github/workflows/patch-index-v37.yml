name: Safely bump app to v3.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-index-v37.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version only
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('v3.8', 'v3.9')

          loader = "import('./push-client.js').catch(err => console.warn('Push client load failed:', err));"
          if s.count(loader) != 1:
              raise SystemExit(f'Expected exactly one existing push loader, found {s.count(loader)}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          loader = "import('./push-client.js').catch(err => console.warn('Push client load failed:', err));"
          assert s.count(loader) == 1, 'push client loader must remain exactly once'
          assert 'v3.9' in s, 'version was not bumped to v3.9'
          assert 'v3.8' not in s, 'old version v3.8 remains in index.html'
          PY

      - name: Commit index update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Bump app to v3.9'
            git push
          fi
