name: Apply uniform shift cards v4.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-uniform-v41.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index safely
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Bump visible app version for this update.
          s = s.replace('v3.9', 'v4.1')
          s = s.replace('v4.0', 'v4.1')

          # Force a fresh push-client load instead of a cached module copy.
          s = s.replace("import('./push-client.js').catch(err => console.warn('Push client load failed:', err));",
                        "import('./push-client.js?v=4.1').catch(err => console.warn('Push client load failed:', err));")
          s = s.replace("import('./push-client.js?v=4.0').catch(err => console.warn('Push client load failed:', err));",
                        "import('./push-client.js?v=4.1').catch(err => console.warn('Push client load failed:', err));")

          marker = "  .icon-btn.del:hover{ background:var(--danger-light); color:var(--danger); border-color:#f2c9c5; }\n\n  .empty-state{"
          css = """  .icon-btn.del:hover{ background:var(--danger-light); color:var(--danger); border-color:#f2c9c5; }\n\n  /* v4.1: uniform shift history cards */\n  .shift-row{min-height:78px;align-items:center;}\n  .shift-row .date-col{width:64px;min-width:64px;flex:0 0 64px;}\n  .shift-row .mid{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;}\n  .shift-row .badges{min-height:18px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:4px;}\n  .shift-row .pay-col{width:82px;min-width:82px;flex:0 0 82px;}\n  .shift-row .actions{width:66px;min-width:66px;flex:0 0 66px;justify-content:flex-end;}\n  @media (max-width:420px){\n    .shift-row{display:grid!important;grid-template-columns:64px minmax(0,1fr) 82px 66px;grid-template-areas:'date mid pay actions';gap:8px;min-height:86px;padding:12px 10px;align-items:center;flex-wrap:nowrap;}\n    .shift-row .date-col{grid-area:date;width:auto;min-width:0;}\n    .shift-row .mid{grid-area:mid;width:auto!important;order:initial!important;margin-top:0!important;text-align:center!important;min-width:0;}\n    .shift-row .pay-col{grid-area:pay;width:auto;min-width:0;text-align:left;}\n    .shift-row .actions{grid-area:actions;width:auto;min-width:0;display:flex;gap:4px;justify-content:flex-end;}\n    .shift-row .badges{min-height:18px;flex-wrap:nowrap;overflow:hidden;}\n    .shift-row .tag{white-space:nowrap;font-size:9px;padding:2px 4px;}\n    .shift-row .icon-btn{width:30px;height:30px;flex:0 0 30px;}\n  }\n\n  .empty-state{"""

          if '/* v4.1: uniform shift history cards */' not in s:
              if s.count(marker) != 1:
                  raise SystemExit(f'Expected one CSS marker, found {s.count(marker)}')
              s = s.replace(marker, css, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'v4.1' in s
          assert '/* v4.1: uniform shift history cards */' in s
          assert "import('./push-client.js?v=4.1')" in s
          assert s.count('/* v4.1: uniform shift history cards */') == 1
          PY

      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Make shift cards uniform and bump app to v4.1'
            git push
          fi
