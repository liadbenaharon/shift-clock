name: Deploy Firebase Hosting

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stamp current version everywhere in initial HTML
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const { version } = JSON.parse(fs.readFileSync('version.json', 'utf8'));
          let html = fs.readFileSync('index.html', 'utf8');

          // Replace every literal app-version string in the served HTML, including
          // any old inline-script value that could briefly overwrite the header
          // during refresh before updater.js restores the current version.
          html = html.replace(/v\d+\.\d+/g, version);

          fs.writeFileSync('index.html', html);
          console.log(`Stamped ${version} into every HTML version marker`);
          NODE

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project shift-clock-19c2d --non-interactive
