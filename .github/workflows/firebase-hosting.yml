name: Deploy Firebase Hosting

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stamp current version into served files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const { version } = JSON.parse(fs.readFileSync('version.json', 'utf8'));

          let html = fs.readFileSync('index.html', 'utf8');
          html = html.replace(/v\d+\.\d+/g, version);
          fs.writeFileSync('index.html', html);

          let updater = fs.readFileSync('updater.js', 'utf8');
          updater = updater.replace(/const APP_VERSION = 'v\d+\.\d+';/, `const APP_VERSION = '${version}';`);
          fs.writeFileSync('updater.js', updater);

          console.log(`Stamped ${version} into HTML and updater.js`);
          NODE

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project shift-clock-19c2d --non-interactive
