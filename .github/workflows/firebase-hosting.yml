name: Deploy Firebase Hosting

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stamp current version into initial HTML
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const { version } = JSON.parse(fs.readFileSync('version.json', 'utf8'));
          let html = fs.readFileSync('index.html', 'utf8');

          // Keep the very first paint in sync with version.json so a refresh never
          // flashes an old hard-coded version before updater.js runs.
          html = html.replace(
            /(<title>[^<]*?)v\d+\.\d+(<\/title>)/i,
            `$1${version}$2`
          );
          html = html.replace(
            /(<header\b[\s\S]*?<h1\b[^>]*>[\s\S]*?<span\b[^>]*>)v\d+\.\d+(<\/span>)/i,
            `$1${version}$2`
          );

          fs.writeFileSync('index.html', html);
          console.log(`Stamped ${version} into initial HTML`);
          NODE

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project shift-clock-19c2d --non-interactive
